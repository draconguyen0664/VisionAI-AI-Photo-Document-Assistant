services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: visionai
      POSTGRES_USER: ${DATABASE_USERNAME:-visionai}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-visionai-local}
    ports: ["127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
  redis:
    image: redis:7.4-alpine
    ports: ["127.0.0.1:6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
  minio:
    build: ./infra/minio
    image: visionai-minio:local
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-visionai-local}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-visionai-local-secret}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["minio-data:/data"]
volumes:
  postgres-data:
  redis-data:
  minio-data:
