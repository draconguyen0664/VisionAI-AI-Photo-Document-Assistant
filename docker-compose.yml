services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: visionai
      POSTGRES_USER: ${DATABASE_USERNAME:-visionai}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-visionai-local}
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-visionai-local}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-visionai-local-secret}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]
volumes:
  postgres-data:
  redis-data:
  minio-data:
