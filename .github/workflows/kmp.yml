name: kmp
on:
  push: { paths: ['apps/kmp/**', '*.gradle.kts', 'gradle.properties'] }
  pull_request: { paths: ['apps/kmp/**', '*.gradle.kts', 'gradle.properties'] }
jobs:
  android:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: gradle }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - run: ./gradlew :apps:kmp:composeApp:testDebugUnitTest :apps:kmp:composeApp:assembleDebug --no-daemon
